project_id = "ytkpthlhtbxtvtadepqt"

# Per-function JWT settings. The CLI applies these on deploy, so they are part
# of the repo rather than something to remember to re-set in the dashboard.

[functions.plaid-link-token]
verify_jwt = true

[functions.plaid-exchange]
verify_jwt = true

# Unauthenticated on purpose: it has to be checkable before any user account
# exists, and the only thing it discloses is that this project intends to talk
# to Plaid. It never echoes a credential value.
[functions.plaid-health]
verify_jwt = false

# Called by pg_cron, which presents a Vault-held bearer token rather than a
# user JWT. The function does its own constant-time check against that secret
# and refuses when none is configured, so this is not an open endpoint.
[functions.sync-transactions]
verify_jwt = false

[functions.gmail-oauth-start]
verify_jwt = true

# Google's redirect back here is a plain browser GET with no Supabase session
# attached — it cannot carry a bearer token. The one-time `state` row minted
# by gmail-oauth-start is the actual guard; see that function's comments.
[functions.gmail-oauth-callback]
verify_jwt = false

# Same reasoning as sync-transactions: cron presents a Vault-held secret, not
# a user JWT.
[functions.sync-bills]
verify_jwt = false

# Same reasoning again: cron presents a Vault-held secret, not a user JWT.
[functions.send-alerts]
verify_jwt = false

# Two callers, so verify_jwt stays off and the function checks both itself:
# cron presenting a Vault-held secret (every household), and a signed-in
# person tapping "Find categories for these" (only their own households, via
# their own token and RLS). Turning verify_jwt on here would lock cron out.
[functions.categorize-llm]
verify_jwt = false

# Called directly by a signed-in household member from the Advisor tab, so
# (unlike the cron-triggered functions above) a real Supabase JWT is exactly
# what identifies the caller here.
[functions.advisor-note]
verify_jwt = true

# Cron-triggered, same reasoning as categorize-llm/send-alerts above.
[functions.advisor-daily]
verify_jwt = false

# Called directly by a signed-in household member from the "Add a bill" form,
# same reasoning as advisor-note above.
[functions.parse-bill-text]
verify_jwt = true
