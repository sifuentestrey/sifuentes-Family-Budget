<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Family Budget</title>

<!-- Installable to the home screen on Android and iOS. -->
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#f6f6f3" />

<!-- iOS ignores the manifest for the home-screen icon and launch behaviour,
     so these have to be declared separately. -->
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Budget" />
<meta name="mobile-web-app-capable" content="yes" />
<!-- Open Props (MIT) — vendored, not CDN-linked, so it works offline like
     everything else this app caches. https://open-props.style — used here
     only for its normalize layer; the design tokens below are this app's
     own, so every colour, size and radius comes from one place. -->
<link rel="stylesheet" href="./vendor/open-props-normalize.min.css" />
<link rel="stylesheet" href="./vendor/open-props.min.css" />
<style>
  /* ==========================================================================
   * Family Budget — design system ("Signal")
   *
   * The household picked this direction from three, so the intent is worth
   * writing down rather than rediscovering: a soft grey ground with white
   * cards floating on it, heavy rounded type, and one near-black hero card
   * carrying the single number a screen exists to answer. One hot coral is
   * the only saturated colour, and it means "this wants you" — the active
   * tab, a link, a category over its target. Green is money coming in and
   * nothing else.
   *
   * The rule that keeps this cohesive: there is ONE way to draw each kind of
   * thing. One list row (.row) for bills, transactions, subscriptions, income
   * streams, shifts, members and accounts alike. One card (.card). One button
   * scale (.btn). One form field (.field). Views compose these; they do not
   * invent their own.
   *
   * Dark is not an inversion. The ground drops to near-black, cards lift
   * *above* it rather than sitting flat, and the hero — which is a black card
   * on a grey ground in light — becomes the one raised surface, since a black
   * card on a black ground would disappear.
   * ====================================================================== */

  :root {
    /* Ground and surfaces */
    --bg: #f4f5f8;
    --surface: #fff;
    --surface-2: #f8f9fb;
    --border: #e9eaf0;
    --border-strong: #d6d9e2;

    /* Text — cool near-black, biased very slightly blue like the ground */
    --text: #14161c;
    --text-2: #4c5261;
    --muted: #767b8a;

    /* The one saturated colour: attention and action. */
    --accent: #f0402f;
    --accent-ink: #cf3323;
    --accent-soft: #ffece9;
    --on-accent: #fff;

    /* Money coming in, and nothing else. */
    --positive: #0d8f5f;
    --positive-soft: #e4f5ed;

    --warn: #b46a10;
    --warn-soft: #fdf1de;
    --negative: #d13b2a;
    --negative-soft: #ffeae7;
    --quiet-soft: #f0f1f6;

    /* The hero card: near-black in light, the one raised surface in dark. */
    --hero-bg: #14161c;
    --hero-ink: #fff;
    --hero-label: #9aa0b2;
    --hero-note: #b9bfcd;
    --hero-rule: #2c2f38;

    /* Shape — rounder than most apps, on purpose. */
    --radius-lg: 22px;
    --radius: 18px;
    --radius-sm: 11px;
    --radius-full: 999px;

    /* Cards lift off the ground rather than being outlined onto it. */
    --shadow-sm: 0 1px 2px rgba(20, 22, 28, 0.05);
    --shadow-md: 0 2px 4px rgba(20, 22, 28, 0.05), 0 10px 24px -16px rgba(20, 22, 28, 0.35);
    --shadow-lg: 0 2px 6px rgba(20, 22, 28, 0.06), 0 20px 40px -20px rgba(20, 22, 28, 0.4);

    /* Deterministic avatar palette. Deep and slightly desaturated so a column
       of them reads as a set rather than as confetti. */
    --av-0: #2f6f5a; --av-1: #8a4b28; --av-2: #45589b;
    --av-3: #8f3a55; --av-4: #2d6f85; --av-5: #6b5aa6;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f13;
      --surface: #171a20;
      --surface-2: #1e222a;
      --border: #242832;
      --border-strong: #333845;

      --text: #f1f2f6;
      --text-2: #b6bcc9;
      --muted: #838a99;

      --accent: #ff6a58;
      --accent-ink: #ff8574;
      --accent-soft: #34201d;
      --on-accent: #1a0d0b;

      --positive: #35c98d;
      --positive-soft: #12291f;

      --warn: #e0a552;
      --warn-soft: #2f2415;
      --negative: #f0705d;
      --negative-soft: #331b18;
      --quiet-soft: #20242c;

      /* Lifted, not black-on-black. */
      --hero-bg: #232833;
      --hero-ink: #f6f7fa;
      --hero-label: #98a0b1;
      --hero-note: #b6bcc9;
      --hero-rule: #343a47;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.45);
      --shadow-md: 0 2px 4px rgba(0, 0, 0, 0.45), 0 10px 24px -16px rgba(0, 0, 0, 0.8);
      --shadow-lg: 0 2px 6px rgba(0, 0, 0, 0.5), 0 20px 40px -20px rgba(0, 0, 0, 0.85);

      --av-0: #3d8a70; --av-1: #a75f35; --av-2: #5b6fb8;
      --av-3: #a84a68; --av-4: #3a89a2; --av-5: #8271c4;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    /* Rounded first: on iOS this is SF Pro Rounded, which is what gives the
       whole app its friendlier, less spreadsheet-like voice. Everything else
       falls back through the usual system stack. */
    font: 16px/1.5 "SF Pro Rounded", ui-rounded, -apple-system, BlinkMacSystemFont,
          "Segoe UI Variable", "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* Respect the notch and the home indicator when launched standalone.
   * Bottom padding clears the fixed tab bar (see .tabbar). */
  #app {
    max-width: 560px; margin: 0 auto;
    padding: env(safe-area-inset-top) calc(14px + env(safe-area-inset-right))
             calc(92px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  }
  @media (min-width: 900px) { #app { max-width: 680px; } }

  /* --- Typography ------------------------------------------------------- */

  h1, h2, h3 { margin: 0; font-weight: 640; letter-spacing: -0.02em; }
  .muted { color: var(--muted); }
  .tabular { font-variant-numeric: tabular-nums; }

  .prose { font-size: 14px; line-height: 1.55; color: var(--text-2); }
  .prose-sm { font-size: 13px; line-height: 1.55; color: var(--muted); }

  /* --- App bar ---------------------------------------------------------- */

  .app-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 2px 10px;
  }
  .app-bar-text { min-width: 0; }
  .app-bar-title { font-size: 22px; font-weight: 800; letter-spacing: -0.035em; }
  .app-bar-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .icon-btn {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: var(--radius-full);
    border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font: inherit; padding: 0;
  }
  .icon-btn:active { background: var(--surface-2); }

  /* --- Sections --------------------------------------------------------- */

  .section { margin-top: 20px; }
  .section:first-child { margin-top: 2px; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; margin-bottom: 7px; padding: 0 3px;
  }
  .section-title { font-size: 16px; font-weight: 780; letter-spacing: -0.025em; }
  .section-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .section-action {
    background: none; border: 0; padding: 0; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--accent);
    white-space: nowrap;
  }

  /* --- Hero ------------------------------------------------------------- */
  /* The one number a screen exists to answer. docs/ui/README.md's hero card:
   * big, plain, bold sans, tight tracking — never a gradient. */

  /* The hero is the one dark card on the screen. It carries the single
     number the screen exists to answer, and nothing else competes with it. */
  .hero {
    background: var(--hero-bg); color: var(--hero-ink); border: 0;
    border-radius: var(--radius-lg); padding: 17px 17px 15px;
    box-shadow: var(--shadow-md);
  }
  .hero-label {
    font-size: 11px; font-weight: 700; color: var(--hero-label);
    text-transform: uppercase; letter-spacing: 0.07em;
  }
  .hero-value {
    font-size: 38px; font-weight: 800; letter-spacing: -0.045em; line-height: 1.04;
    margin: 4px 0 5px; font-variant-numeric: tabular-nums;
  }
  .hero-value.bad { color: #ff8574; }
  .hero-value.good { color: #4fd6a0; }
  .hero-note { font-size: 12.5px; line-height: 1.45; color: var(--hero-note); }
  .hero-foot {
    display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 11px;
    padding-top: 10px; border-top: 1px solid var(--hero-rule);
    font-size: 12px; color: var(--hero-note); font-variant-numeric: tabular-nums;
  }
  .hero-foot b { color: var(--hero-ink); font-weight: 700; }

  .hero-sm .hero-value { font-size: 27px; }

  /* The month in two halves: what was always going out, and what wasn't.
     One bar, two segments — a pie would need a legend to read and would
     hide exactly the comparison the bar makes obvious. */
  .split { margin-top: 13px; }
  .split-bar {
    display: flex; height: 8px; border-radius: var(--radius-full);
    overflow: hidden; background: var(--hero-rule);
  }
  .split-bar i { display: block; height: 100%; }
  .split-bills { background: var(--hero-note); }
  .split-rest { background: var(--accent); }
  .split-keys {
    display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 9px;
    font-size: 11.5px; color: var(--hero-note); font-variant-numeric: tabular-nums;
  }
  .split-key { display: inline-flex; align-items: center; gap: 6px; }
  .split-key b { width: 8px; height: 8px; border-radius: 3px; display: block; }

  /* --- Cards ------------------------------------------------------------ */

  .card {
    background: var(--surface); border: 0;
    border-radius: var(--radius); padding: 14px 15px;
    box-shadow: var(--shadow-sm);
  }
  .card + .card { margin-top: 8px; }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 4px;
  }
  .card-title { font-size: 14px; font-weight: 650; }
  .card-body { margin-top: 10px; }
  .card.done { opacity: 0.6; }
  .card.flush { padding: 0; overflow: hidden; }

  /* --- Stat row --------------------------------------------------------- */

  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat-row.two { grid-template-columns: repeat(2, 1fr); }
  .stat {
    background: var(--surface); border: 0; box-shadow: var(--shadow-sm);
    border-radius: var(--radius-sm); padding: 11px 12px;
  }
  .stat-label {
    font-size: 11px; font-weight: 620; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .stat-value {
    font-size: 18px; font-weight: 780; margin-top: 3px;
    letter-spacing: -0.025em; font-variant-numeric: tabular-nums;
  }
  .stat-value.positive { color: var(--positive); }
  .stat-value.negative { color: var(--negative); }
  .stat-note { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  /* --- The one list row ------------------------------------------------- */
  /* Used for bills, transactions, subscriptions, income streams, shifts,
   * paystubs, household members, bank accounts. Slots: avatar, body
   * (title + sub), end (amount + sub), optional chevron. */

  /* One card per list, hairlines between the rows — not a card per row. A
     stack of twenty separate cards is twenty borders, twenty shadows and
     twenty gaps of dead space, which is most of why a long list felt heavy. */
  .list {
    display: flex; flex-direction: column;
    background: var(--surface); border: 0;
    border-radius: var(--radius); overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .list > * + * { border-top: 1px solid var(--border); }
  /* Kept for the few places that genuinely want detached rows (bill
     suggestions, anything with its own buttons). */
  .list.loose {
    background: transparent; border: 0; box-shadow: none; overflow: visible;
    gap: 6px; border-radius: 0;
  }
  .list.loose > * + * { border-top: 0; }
  .list.loose > .row { box-shadow: var(--shadow-sm); border-radius: var(--radius); }

  .row {
    display: flex; align-items: center; gap: 11px;
    background: var(--surface); border: 0;
    padding: 10px 13px;
    text-align: left; width: 100%; font: inherit; color: var(--text);
  }
  button.row { cursor: pointer; }
  button.row:active, .row.tappable:active { background: var(--surface-2); }
  .row.flat { background: transparent; border-color: transparent; padding: 9px 2px; }
  .row.inset { border-radius: 0; border-width: 0 0 1px; box-shadow: none; }
  .row.inset:last-child { border-bottom-width: 0; }
  .row.accent { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .row.warn { background: var(--warn-soft); box-shadow: inset 3px 0 0 var(--warn); }

  .row-avatar {
    flex-shrink: 0; width: 32px; height: 32px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 800; color: #fff; letter-spacing: -0.01em;
  }
  .row-avatar.av-0 { background: var(--av-0); }
  .row-avatar.av-1 { background: var(--av-1); }
  .row-avatar.av-2 { background: var(--av-2); }
  .row-avatar.av-3 { background: var(--av-3); }
  .row-avatar.av-4 { background: var(--av-4); }
  .row-avatar.av-5 { background: var(--av-5); }
  /* A real merchant logo, painted over the coloured initial. White plate
     because most logos are drawn for a white background, and several are
     transparent PNGs that would vanish in dark mode. The initial underneath
     is what shows if the image 404s, is blocked, or never resolves. */
  .row-avatar.has-logo { position: relative; overflow: hidden; }
  .row-avatar.has-logo img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; padding: 3px; border-radius: inherit;
    /* Invisible, and painting no plate of its own, until it has actually
       loaded — otherwise a pending or blocked request covers the initial
       with a blank white circle, which is worse than no logo. */
    opacity: 0;
  }
  .row-avatar.has-logo img.loaded { opacity: 1; background: #fff; }
  .row-avatar.ghost {
    background: var(--quiet-soft); color: var(--muted);
    border: 1px dashed var(--border-strong);
  }

  .row-body { flex: 1; min-width: 0; }
  .row-title {
    font-size: 14px; font-weight: 680; letter-spacing: -0.015em;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    /* One line, ellipsised. A payee that wraps to three lines is what makes
       one row in a list twice the height of its neighbours. min-width:0 is
       what actually lets it shrink — without it a nowrap title pushes its
       flex parent wider than the card and the whole row overflows. */
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: block; min-width: 0;
  }
  .row-sub {
    font-size: 11.5px; color: var(--muted); margin-top: 1px;
    display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
  }
  .row-end { flex-shrink: 0; text-align: right; }
  .row-amount { font-size: 14px; font-weight: 720; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row-amount.income, .row-amount.positive { color: var(--positive); }
  .row-amount.negative { color: var(--negative); }
  .row-amount-sub { font-size: 11px; color: var(--muted); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .row-chev { flex-shrink: 0; color: var(--muted); display: flex; }
  .row-actions { display: flex; gap: 8px; margin-top: 10px; }
  .row-stack { display: block; }
  .row-stack .row-actions { margin-top: 12px; }

  /* --- Key/value breakdown ---------------------------------------------- */

  .kv {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .kv-row {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 11px 14px; font-size: 14px; font-variant-numeric: tabular-nums;
    border-top: 1px solid var(--border);
  }
  .kv-row:first-child { border-top: 0; }
  .kv-label { color: var(--text-2); }
  .kv-row.total { font-weight: 650; background: var(--surface-2); }
  .kv-row.total .kv-label { color: var(--text); }
  .kv-row .negative { color: var(--negative); }

  /* --- Chips ------------------------------------------------------------ */

  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 720; letter-spacing: 0.04em;
    text-transform: uppercase; padding: 2px 7px; border-radius: 7px;
    background: var(--quiet-soft); color: var(--muted); white-space: nowrap;
  }
  .chip-ok { background: var(--positive-soft); color: var(--positive); }
  .chip-warn { background: var(--warn-soft); color: var(--warn); }
  .chip-bad { background: var(--negative-soft); color: var(--negative); }
  .chip-outline { background: transparent; border: 1px solid var(--border-strong); color: var(--muted); font-weight: 600; }

  /* The category on a transaction row: reads as text, behaves as a button. */
  .cat-pill {
    font: inherit; font-size: 11px; font-weight: 650; color: var(--text-2);
    background: var(--quiet-soft); border: 0; cursor: pointer;
    padding: 2px 7px; border-radius: 7px;
  }
  .cat-pill:active { background: var(--border-strong); }
  .cat-pill.unset { background: var(--accent-soft); color: var(--accent-ink); }

  .badge {
    display: inline-block; min-width: 19px; padding: 0 6px;
    background: var(--accent); color: var(--on-accent);
    border-radius: var(--radius-full); font-size: 11px; font-weight: 700;
    line-height: 19px; text-align: center;
  }
  .badge.alert { background: var(--negative); }

  /* --- Buttons ---------------------------------------------------------- */

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font: inherit; font-size: 14px; font-weight: 720; line-height: 1;
    padding: 11px 17px; border-radius: var(--radius-full);
    border: 1px solid transparent; cursor: pointer; white-space: nowrap;
    background: var(--quiet-soft); color: var(--text);
  }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-sm); }
  .btn-primary:active:not(:disabled) { background: var(--accent-ink); }
  .btn-secondary { background: var(--accent-soft); color: var(--accent-ink); }
  .btn-outline { background: var(--surface); border-color: var(--border); color: var(--text); box-shadow: var(--shadow-sm); }
  .btn-danger { background: var(--negative-soft); color: var(--negative); }
  .btn-sm { font-size: 13px; padding: 8px 13px; }
  .btn-block { display: flex; width: 100%; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Inline text action. The only non-pill button, for "Dismiss"/"Cancel"
   * style choices that must not compete with a real primary action. */
  .linkbtn {
    background: none; border: 0; padding: 0; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--accent);
  }
  .linkbtn.quiet { color: var(--muted); }
  .linkbtn:disabled { opacity: 0.55; cursor: default; }

  /* --- Segmented control ------------------------------------------------ */
  /* Replaces the old "More" menu for sibling views. A tab's sub-screens are
   * reachable in one tap and visibly part of the same place, rather than
   * hidden behind a list of ten links that all looked equally important. */

  .seg {
    display: flex; gap: 3px; padding: 2px; margin-bottom: 12px;
    background: var(--quiet-soft); border-radius: var(--radius-full);
    overflow-x: auto; scrollbar-width: none;
  }
  .seg::-webkit-scrollbar { display: none; }
  .seg-btn {
    flex: 1; white-space: nowrap; font: inherit; font-size: 12.5px; font-weight: 650;
    padding: 6px 12px; border: 0; border-radius: var(--radius-full);
    background: none; color: var(--muted); cursor: pointer;
  }
  .seg-btn.active {
    background: var(--surface); color: var(--text); font-weight: 750;
    box-shadow: var(--shadow-sm);
  }

  /* --- Month picker ----------------------------------------------------- */

  .month-picker {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 10px;
  }
  .month-picker-label { flex: 1; text-align: center; font-size: 13.5px; font-weight: 620; }
  .chev-btn {
    width: 30px; height: 30px; border-radius: var(--radius-full);
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-2); cursor: pointer; display: flex;
    align-items: center; justify-content: center; padding: 0;
  }
  .chev-btn:disabled { opacity: 0.3; cursor: default; }

  /* --- Meters ----------------------------------------------------------- */

  .meter {
    height: 5px; background: var(--quiet-soft);
    border-radius: var(--radius-full); overflow: hidden; margin-top: 7px;
  }
  /* Neutral by default: a "where it went" bar is a share of the month, not a
     verdict. Green when a target is being kept to, coral when it isn't —
     coral only ever means "this wants you". */
  .meter-fill { height: 100%; background: var(--border-strong); border-radius: var(--radius-full); }
  .meter-fill.ok { background: var(--positive); }
  .meter-fill.warn { background: var(--accent); }
  .meter-fill.quiet { background: var(--quiet-soft); }

  /* --- Banners ---------------------------------------------------------- */

  .banner {
    display: flex; gap: 10px; align-items: flex-start; justify-content: space-between;
    padding: 10px 13px; border-radius: var(--radius-sm);
    font-size: 12.5px; line-height: 1.45; margin-bottom: 10px;
    border: 1px solid transparent; background: var(--quiet-soft); color: var(--text-2);
  }
  .banner strong { color: var(--text); font-weight: 620; }
  .banner-good { background: var(--positive-soft); color: var(--positive); }
  .banner-good strong { color: var(--positive); }
  .banner-warn {
    background: var(--warn-soft); color: var(--warn);
    border-color: color-mix(in srgb, var(--warn) 22%, transparent);
  }
  .banner-warn strong { color: var(--warn); }
  .banner-bad {
    background: var(--negative-soft); color: var(--negative);
    border-color: color-mix(in srgb, var(--negative) 22%, transparent);
  }
  .banner-bad strong { color: var(--negative); }
  .banner-body { min-width: 0; }

  /* --- Notes and disclaimers -------------------------------------------- */

  .note {
    padding: 13px 15px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 13px; line-height: 1.55; color: var(--text-2);
  }
  .note strong { color: var(--text); font-weight: 620; }
  .note ul { margin: 8px 0 0; padding-left: 18px; }
  .note li { margin-bottom: 4px; }
  .disclaimer {
    margin-top: 20px; padding: 13px 15px;
    border: 1px dashed var(--border-strong); border-radius: var(--radius);
    font-size: 12.5px; line-height: 1.55; color: var(--muted);
  }

  /* --- Disclosure ------------------------------------------------------- */
  /* Open Props' normalize gives details/summary their own surface and padding,
   * which reads as a grey slab dropped into the middle of a card. Reset both
   * before this app's own styling, or every "show more" looks like an error. */

  details, summary {
    background: none; padding: 0; border-radius: 0;
    box-shadow: none; border: 0;
  }
  .fold { margin-top: 10px; }
  /* margin:0 for the same reason as .cat-row's summary — the normalize
     stylesheet gives every <summary> a negative margin. */
  .fold > summary {
    cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent);
    list-style: none; margin: 0; padding: 4px 2px;
  }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::after { content: " ›"; display: inline-block; transition: transform 0.15s; }
  .fold[open] > summary::after { transform: rotate(90deg); }
  .fold-body { margin-top: 8px; }

  /* --- Expandable category row ------------------------------------------ */
  /* "Where it went": the total is the summary, its transactions the body.
     The whole row is the hit target, so it opens under a thumb. */
  .cat-row { display: block; padding: 0; }
  .cat-row > summary > div { min-width: 0; }
  .cat-row > summary {
    /* display:block, not the UA's list-item: a list-item summary inside a
       flex list lays out against the wrong containing block in Chrome and
       ends up wider than the card it sits in. */
    /* margin:0 undoes the negative margin the normalize stylesheet puts on
       every <summary> to widen its tap target — inside a card that instead
       makes the row 32px wider than the card and it spills out both sides. */
    display: block; cursor: pointer; list-style: none; margin: 0;
    padding: 10px 13px; border-radius: inherit;
  }
  .cat-row > summary::-webkit-details-marker { display: none; }
  .cat-row > summary .row-title::after {
    content: " ›"; color: var(--muted); display: inline-block;
    transition: transform 0.15s;
  }
  .cat-row[open] > summary .row-title::after { transform: rotate(90deg); }
  .cat-row[open] > summary:active, .cat-row > summary:active { background: var(--surface-2); }
  .cat-body {
    border-top: 1px solid var(--border);
    background: var(--surface-2);
  }
  .cat-row[open] > summary { background: var(--surface-2); }
  .cat-body > * + * { border-top: 1px solid var(--border); }
  .cat-body .row { background: transparent; padding: 8px 13px 8px 11px; }

  /* --- Splitting a charge ----------------------------------------------- */

  /* The parts of an already-split charge, shown under it in the list. */
  .split-parts {
    display: flex; flex-wrap: wrap; gap: 3px 12px; margin-top: 4px;
    font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .split-parts b { color: var(--text-2); font-weight: 700; }

  /* A row holding an open editor is no longer one line, so stop centring the
     avatar and the amount against the whole height of it. */
  .row:has(.split-form) { align-items: flex-start; }
  .row:has(.split-form) .row-end { padding-top: 2px; }

  .split-form {
    display: flex; flex-direction: column; gap: 8px;
    margin-top: 9px; padding: 10px; border-radius: var(--radius-sm);
    background: var(--surface-2);
  }
  .split-row { display: flex; gap: 7px; align-items: center; }
  .split-row .input { flex: 0 0 96px; }
  .split-row .select { flex: 1; min-width: 0; }
  .split-foot {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; font-size: 12px; font-variant-numeric: tabular-nums;
  }
  /* The remainder is the whole point of the editor: it has to be obvious
     whether the parts add up yet, without reading the numbers back. */
  .split-foot .ok { color: var(--positive); font-weight: 700; }
  .split-foot .off { color: var(--accent); font-weight: 700; }

  /* --- Forms ------------------------------------------------------------ */

  .form { display: flex; flex-direction: column; gap: 12px; }
  .field { display: block; }
  .field-label {
    display: block; font-size: 12.5px; font-weight: 600;
    color: var(--text-2); margin-bottom: 5px;
  }
  .field-hint { font-size: 12.5px; line-height: 1.5; color: var(--muted); margin-top: 6px; }
  .input, .select, .textarea {
    width: 100%; font: inherit; font-size: 15px; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 11px 13px;
  }
  .input:focus, .select:focus, .textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .input:disabled, .select:disabled, .textarea:disabled { opacity: 0.6; }
  .textarea { resize: vertical; line-height: 1.5; }
  .field-inline { display: flex; gap: 8px; }
  .field-inline .input { flex: 1; }
  .select-sm {
    font-size: 12.5px; padding: 5px 8px; border-radius: 8px;
    max-width: 160px; background: var(--surface-2);
    border: 1px solid var(--border); color: var(--text); font-family: inherit;
  }

  /* --- Table (trends only) ---------------------------------------------- */

  .table {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow-x: auto;
  }
  .table-head, .table-row {
    display: grid; gap: 4px; padding: 10px 14px; font-size: 13px; align-items: center;
    grid-template-columns: minmax(104px, 1.4fr) repeat(auto-fit, minmax(58px, 1fr));
  }
  .table-head {
    color: var(--muted); font-size: 10.5px; font-weight: 650;
    text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }
  .table-row { border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  .table-row:first-of-type { border-top: 0; }
  .table-row span:not(:first-child), .table-head span:not(:first-child) { text-align: right; }
  .table-row .strong { font-weight: 640; }

  /* --- Empty states ----------------------------------------------------- */

  .empty {
    text-align: center; padding: 36px 24px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg);
  }
  .empty-icon { color: var(--muted); opacity: 0.7; margin-bottom: 10px; }
  .empty-title { font-size: 15px; font-weight: 620; }
  .empty-body { font-size: 13.5px; color: var(--muted); line-height: 1.55; margin-top: 6px; }
  .empty .btn { margin-top: 14px; }

  /* --- Bottom tab bar --------------------------------------------------- */

  .tabbar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 0; width: 100%; max-width: 560px;
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--surface);
    border-top: 1px solid var(--border);
    box-shadow: 0 -8px 24px -20px rgba(20, 22, 28, 0.5);
    display: flex; z-index: 40;
  }
  @media (min-width: 900px) { .tabbar { max-width: 680px; } }
  .tab {
    flex: 1; background: none; border: 0; cursor: pointer; font: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 4px 12px; color: var(--muted);
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.01em;
    position: relative;
  }
  .tab.active { color: var(--accent); }
  .tab-icon { display: flex; }
  .tab-dot {
    position: absolute; top: 8px; left: 50%; margin-left: 7px;
    width: 7px; height: 7px; border-radius: var(--radius-full);
    background: var(--negative); box-shadow: 0 0 0 2px var(--surface);
  }

  /* --- Install hint ----------------------------------------------------- */

  .install-hint {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(86px + env(safe-area-inset-bottom));
    max-width: 536px; margin: 0 auto;
    background: var(--surface); border: 1px solid var(--accent);
    border-radius: var(--radius); padding: 13px 15px;
    font-size: 13px; line-height: 1.5; color: var(--text-2);
    box-shadow: var(--shadow-lg); z-index: 50;
  }
  .install-hint strong { color: var(--text); }

  /* --- Loading ---------------------------------------------------------- */

  .loading { padding: 80px 20px; text-align: center; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
  <div id="app"></div>
  <!-- retired-overlay-sentinels: simple-finance-shell.js core-tab-router.js simple-home.js simple-budget.js money-plan-ui.js -->
  <script src="./simple-finance-shell.js"></script>
  <script src="./core-tab-router.js"></script>
  <script type="module" src="./app.js"></script>
  <script type="module" src="./simple-home.js"></script>
  <script type="module" src="./finance-brain-ui.js"></script>
  <script type="module" src="./plan-command-center.js"></script>
  <script>
    // Registered outside the module so a service-worker failure can never stop
    // the app itself from loading.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {
          /* Offline support is a bonus, not a requirement. */
        });
      });
    }
  </script>
</body>
